name: 워크플로우 활성 상태 유지

on:
  schedule:
    # 매월 1일 KST 09:00 (UTC 00:00)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6

      - name: 활성 상태 유지 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last_keepalive
          git add .github/last_keepalive
          git commit -m "chore: 자동 활성 유지 $(date -u '+%Y-%m')"
          git push
